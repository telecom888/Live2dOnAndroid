name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Sign the APK and publish a GitHub Release
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    outputs:
      version: ${{ steps.version.outputs.version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NDK_VERSION: 27.2.12479018
    steps:
      - name: Checkout source and models
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Read APK version
        id: version
        shell: bash
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          version = re.search(r'versionName = "([0-9]+\.[0-9]+\.[0-9]+)"', Path('app/build.gradle.kts').read_text()).group(1)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\n')
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;$NDK_VERSION"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Install Rust Android tools
        shell: bash
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --locked

      - name: Fetch Live2D Lua runtime
        shell: bash
        run: |
          git clone https://github.com/EasyLive2D/Live2D-v2-Lua.git third_party/Live2D-v2-Lua
          git -C third_party/Live2D-v2-Lua checkout c46c254c14cffda57bb4eefe0fdca4ae3cc73206

      - name: Build LuaJIT for Android arm64
        shell: bash
        run: |
          git clone --depth 1 --branch v2.1 https://github.com/LuaJIT/LuaJIT.git "$RUNNER_TEMP/LuaJIT"
          tool="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          make -C "$RUNNER_TEMP/LuaJIT" -j"$(nproc)" \
            HOST_CC=gcc CROSS= \
            CC="$tool/aarch64-linux-android26-clang" \
            TARGET_AR="$tool/llvm-ar rcus" TARGET_STRIP="$tool/llvm-strip" \
            TARGET_SYS=Linux XCFLAGS="-DLUAJIT_ENABLE_GC64"
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp "$RUNNER_TEMP/LuaJIT/src/libluajit.so" app/src/main/jniLibs/arm64-v8a/

      - name: Extract Android Zstd native library
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            https://repo.maven.apache.org/maven2/com/github/luben/zstd-jni/1.5.6-9/zstd-jni-1.5.6-9.aar \
            --output "$RUNNER_TEMP/zstd.aar"
          unzip -p "$RUNNER_TEMP/zstd.aar" jni/arm64-v8a/libzstd-jni-1.5.6-9.so \
            > app/src/main/jniLibs/arm64-v8a/libzstd-jni-1.5.6-9.so
          test -s app/src/main/jniLibs/arm64-v8a/libzstd-jni-1.5.6-9.so

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test and build debug and release APKs
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease

      - name: Verify packaged native libraries
        shell: bash
        run: |
          python3 - <<'PY'
          import zipfile
          for path in ("app/build/outputs/apk/debug/app-debug.apk", "app/build/outputs/apk/release/app-release-unsigned.apk"):
              with zipfile.ZipFile(path) as apk:
                  for library in ("libbangdreampet.so", "libluajit.so", "libzstd-jni-1.5.6-9.so"):
                      entry = apk.getinfo("lib/arm64-v8a/" + library)
                      assert entry.file_size > 0, (path, library)
          PY

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Live2dOnAndroid-debug-arm64
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: Live2dOnAndroid-release-unsigned-arm64
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7

  sign-and-publish:
    needs: build
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.ref == 'refs/heads/main' && inputs.publish_release)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    concurrency:
      group: release-${{ needs.build.outputs.version }}
      cancel-in-progress: false
    env:
      RELEASE_VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Checkout release scripts
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            tools/ci
            .github

      - name: Download unsigned APK from this build
        uses: actions/download-artifact@v4
        with:
          name: Live2dOnAndroid-release-unsigned-arm64
          path: ${{ runner.temp }}/unsigned

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android signing tools
        uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;35.0.0'

      - name: Sign and verify APK
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.BANGDREAM_RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.BANGDREAM_RELEASE_KEY_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.BANGDREAM_RELEASE_KEY_ALIAS }}
          EXPECTED_SIGNING_CERT_SHA256: a133a52626d649efaf1c49f830279ab1f07ab1caa2a972ed858cc7a0a1ec06a3
        shell: bash
        run: |
          python3 tools/ci/sign_release.py \
            --input "$RUNNER_TEMP/unsigned/app-release-unsigned.apk" \
            --output-dir "$RUNNER_TEMP/signed" --version "$RELEASE_VERSION" \
            --build-tools "$ANDROID_HOME/build-tools/35.0.0"

      - name: Upload signed APK and checksums
        uses: actions/upload-artifact@v4
        with:
          name: Live2dOnAndroid-release-signed-arm64
          path: |
            ${{ runner.temp }}/signed/*.apk
            ${{ runner.temp }}/signed/SHA256SUMS.txt
            ${{ runner.temp }}/signed/build-provenance.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish verified GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 tools/ci/publish_release.py --directory "$RUNNER_TEMP/signed" --version "$RELEASE_VERSION"
