name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NDK_VERSION: 27.2.12479018
    steps:
      - name: Checkout source and models
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;$NDK_VERSION"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Install Rust Android tools
        shell: bash
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --locked

      - name: Fetch Live2D Lua runtime
        shell: bash
        run: |
          git clone https://github.com/EasyLive2D/Live2D-v2-Lua.git third_party/Live2D-v2-Lua
          git -C third_party/Live2D-v2-Lua checkout c46c254c14cffda57bb4eefe0fdca4ae3cc73206

      - name: Build LuaJIT for Android arm64
        shell: bash
        run: |
          git clone --depth 1 --branch v2.1 https://github.com/LuaJIT/LuaJIT.git "$RUNNER_TEMP/LuaJIT"
          tool="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          make -C "$RUNNER_TEMP/LuaJIT" -j"$(nproc)" \
            HOST_CC=gcc CROSS="$tool/llvm-" \
            TARGET_CC="$tool/aarch64-linux-android26-clang" \
            TARGET_LD="$tool/aarch64-linux-android26-clang" \
            TARGET_SYS=Linux XCFLAGS="-DLUAJIT_ENABLE_GC64"
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp "$RUNNER_TEMP/LuaJIT/src/libluajit.so" app/src/main/jniLibs/arm64-v8a/

      - name: Extract Android Zstd native library
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            https://repo.maven.apache.org/maven2/com/github/luben/zstd-jni/1.5.6-9/zstd-jni-1.5.6-9.aar \
            --output "$RUNNER_TEMP/zstd.aar"
          unzip -p "$RUNNER_TEMP/zstd.aar" jni/arm64-v8a/libzstd-jni-1.5.6-9.so \
            > app/src/main/jniLibs/arm64-v8a/libzstd-jni-1.5.6-9.so
          test -s app/src/main/jniLibs/arm64-v8a/libzstd-jni-1.5.6-9.so

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test and build debug APK
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Verify packaged native libraries
        shell: bash
        run: |
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile("app/build/outputs/apk/debug/app-debug.apk") as apk:
              for library in ("libbangdreampet.so", "libluajit.so", "libzstd-jni-1.5.6-9.so"):
                  entry = apk.getinfo("lib/arm64-v8a/" + library)
                  assert entry.file_size > 0, library
          PY

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Live2dOnAndroid-debug-arm64
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7
